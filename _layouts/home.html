---
layout: compress
---
{% include base_path %}
<!doctype html>
<html lang="en" class="no-js">
  <head>
    <meta charset="utf-8">
    {% include seo.html %}
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f6f7f3">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" type="image/svg+xml" href="{{ site.baseurl }}/images/favicon.svg">
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/home.css">
    <script>
      document.documentElement.classList.remove('no-js');
      document.documentElement.classList.add('js');
      try {
        var savedTheme = localStorage.getItem('taoyong-theme');
        var preferredTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = savedTheme || preferredTheme;
      } catch (error) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Taoyong Cui",
        "alternateName": "崔涛镛",
        "url": "https://taoyongcui.github.io/",
        "image": "https://taoyongcui.github.io/images/profile.jpg",
        "jobTitle": "Ph.D. Student and Visiting Researcher",
        "affiliation": [
          {"@type": "CollegeOrUniversity", "name": "The Chinese University of Hong Kong"},
          {"@type": "CollegeOrUniversity", "name": "Stanford University"}
        ],
        "sameAs": [
          "https://github.com/TaoyongCui",
          "https://scholar.google.com/citations?user=_8vmQn0AAAAJ"
        ]
      }
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <header class="site-header" data-site-header>
      <div class="nav-shell">
        <a class="brand" href="#top" aria-label="Taoyong Cui — Home">
          <span class="brand__mark" aria-hidden="true">TC<span>.AI</span></span>
          <span class="brand__text">(Taoyong Cui <span lang="zh-CN">崔涛镛</span>)</span>
        </a>

        <nav class="site-nav" id="site-navigation" aria-label="Primary navigation">
          <a href="#about">About</a>
          <a href="#research">Research</a>
          <a href="#news">News</a>
          <a href="#talks">Talks</a>
          <a href="#contact">Contact</a>
        </nav>

        <div class="nav-actions">
          <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch color theme">
            <svg class="theme-toggle__sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"></path></svg>
            <svg class="theme-toggle__moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.4 15.6A9 9 0 0 1 8.4 3.6 9 9 0 1 0 20.4 15.6Z"></path></svg>
          </button>
          <button class="menu-toggle" type="button" data-menu-toggle aria-expanded="false" aria-controls="site-navigation">
            <span class="menu-toggle__label">Menu</span>
            <span class="menu-toggle__lines" aria-hidden="true"><span></span><span></span></span>
          </button>
        </div>
      </div>
    </header>

    <main id="main-content">
      {{ content }}
    </main>

    <script src="{{ site.baseurl }}/assets/js/home.js" defer></script>
  </body>
</html>
